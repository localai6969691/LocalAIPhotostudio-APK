name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      use_all:
        description: "R39: bật CÙNG LÚC mọi tích hợp thật trừ QNN (Play Billing + LiteRT-LM + Play Integrity) — một ô thay cho ba ô riêng; bản này dùng để thử đủ tính năng nhưng dịch vụ thật (Billing/Integrity) chỉ chạy khi đã cấu hình máy chủ + Play Console"
        type: boolean
        default: false
      use_qnn:
        description: "Build với onnxruntime-android-qnn (thử NPU Qualcomm; APK lớn hơn)"
        type: boolean
        default: false
      use_billing:
        description: "Build với Google Play Billing thật (bán credits / gói Pro); mặc định dùng bản stub"
        type: boolean
        default: false
      use_litertlm:
        description: "Build với LiteRT-LM thật (model .litertlm: Gemma 3n / Gemma 4, GPU, hiểu ảnh trên máy); mặc định dùng bản stub"
        type: boolean
        default: false
      litertlm_version:
        description: "Phiên bản com.google.ai.edge.litertlm:litertlm-android (để trống = CI tự chọn bản mới nhất mà D8 đọc được, dự phòng 0.18.1 - xem tools/pick_litertlm_version.py)"
        type: string
        default: ""
      use_integrity:
        description: "Bật Play Integrity thật (-PuseIntegrity=true): app chứng thực thiết bị với máy chủ khi máy chủ đòi (403 integrity_required)"
        type: boolean
        default: false
      integrity_cloud_project:
        description: "Số dự án Google Cloud (chỉ chữ số) cho Play Integrity; trống = chưa cấu hình"
        type: string
        default: ""
      play_release:
        description: "Build theo yêu cầu Google Play: compileSdk/targetSdk 36 (Play bắt buộc từ 31/8/2026). Mặc định tắt: bản tester vẫn nhắm 34"
        type: boolean
        default: false
      perf_r8:
        description: "Job build-perf: dựng THÊM bản perf có R8 (thu nhỏ + tối ưu mã; -PperfMinify=true). Thử nghiệm: có thể lỗi lần đầu, khi đó tải artifact perf-r8-diagnostics để lấy missing_rules.txt"
        type: boolean
        default: false
      sdcpp_ref:
        description: "Nhánh/tag của stable-diffusion.cpp để biên dịch sd-server (nên ghim sang tag đã thử thành công)"
        type: string
        default: "master"

# R41b: tách nhóm theo loại sự kiện — một lần push không còn hủy lượt chạy THỦ CÔNG (vd. use_all, ~20 phút) đang chạy, và ngược lại.
# Trong cùng một loại, lượt mới vẫn hủy lượt cũ (đó là lý do bạn thấy "Canceling since a higher priority waiting request … exists").
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  repo-check:
    # R34c: đối chiếu repo với REPO_MANIFEST.txt để biết CHÍNH XÁC tệp/thư mục nào thiếu (tải lên GitHub chưa đủ). Không chặn các job khác,
    # trừ khi thiếu cả tệp build thiết yếu (khi đó APK cũng không build được).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Giải nén gói zip dự án nếu có ở gốc repo (chỉ cần up zip lên là đủ)
        run: |
          # R34d: GitHub chỉ đọc file workflow từ chính repo, còn MỌI thứ khác có thể nằm trong zip. Zip ghi đè lên workspace (zip thắng tệp lẻ cũ);
          # chịu được zip có/không có thư mục bọc; nhiều zip thì giải nén theo thứ tự tên (sort -V), zip tên "lớn" nhất thắng.
          shopt -s nullglob
          found=0
          while IFS= read -r -d '' z; do
            [ -n "$z" ] || continue
            listing=$(unzip -l "$z" 2>/dev/null || true)
            if ! grep -qE '(^|[ /])settings\.gradle\.kts$' <<<"$listing"; then
              echo "Bỏ qua $z (không phải gói dự án: không có settings.gradle.kts)"; continue
            fi
            found=$((found+1))
            echo "Giải nén $z vào workspace (ghi đè tệp trùng)"
            tmp=$(mktemp -d)
            unzip -oq "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"
            sg=$(find "$tmp" -maxdepth 3 -name settings.gradle.kts -printf '%d %p\n' | sort -n | head -n1 | cut -d' ' -f2-)
            root=$(dirname "$sg")
            if [ -f "$root/.github/workflows/build-apk.yml" ] && ! cmp -s "$root/.github/workflows/build-apk.yml" .github/workflows/build-apk.yml; then
              echo "::notice title=Workflow trong repo khác bản trong zip::GitHub chỉ đọc workflow từ chính repo, nên bản trong zip chưa có hiệu lực. Hãy thay .github/workflows/build-apk.yml trong repo bằng bản trong zip (hoặc bản build-apk.yml đi kèm) để dùng bản mới nhất."
            fi
            rm -rf "$root/.github"
            cp -a "$root"/. ./
            rm -rf "$tmp"
          done < <(printf '%s\0' ./*.zip | sort -zV)
          if [ "$found" -eq 0 ]; then echo "Không có gói zip dự án ở gốc repo - dùng nguyên nội dung repo."; fi

      - name: Đối chiếu repo với danh sách tệp của gói dự án
        run: |
          python3 - <<'PY'
          import hashlib, os, sys
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          out = []
          def say(s=""):
              print(s); out.append(s)
          essential = ["settings.gradle.kts", "build.gradle.kts", "app/build.gradle.kts", "app/src/main/AndroidManifest.xml"]
          optional = {"backend": "test máy chủ trung gian", "tools": "kiểm tra tĩnh, bản port Python, jvm-check", "app/src/test": "JUnit"}
          miss_ess = [f for f in essential if not os.path.isfile(f)]
          for d, why in optional.items():
              if not os.path.isdir(d):
                  print(f"::warning title=Repo thiếu thư mục {d}/::Không có {d}/ trong repo ({why}). Hãy tải thư mục này lên (cùng cấp với app/). Các bước cần nó sẽ được bỏ qua.")
          if not os.path.isfile("REPO_MANIFEST.txt"):
              say("## Repo check\nKhông có `REPO_MANIFEST.txt` ở gốc repo - chỉ kiểm được thư mục cấp 1.")
          else:
              rows = [l.split(" ", 2) for l in open("REPO_MANIFEST.txt", encoding="utf-8").read().splitlines() if l.strip()]
              missing, changed = [], []
              for sha, size, path in rows:
                  if not os.path.isfile(path): missing.append(path); continue
                  if hashlib.sha1(open(path, "rb").read()).hexdigest() != sha: changed.append(path)
              say(f"## Repo check\n- Danh sách gói: {len(rows)} tệp | thiếu trong repo: **{len(missing)}** | khác bản đóng gói: {len(changed)}")
              if missing:
                  tops = {}
                  for m in missing: tops.setdefault(m.split("/")[0], []).append(m)
                  say("- Thiếu theo thư mục cấp 1: " + ", ".join(f"`{k}/` ({len(v)})" for k, v in sorted(tops.items())))
                  for k, v in sorted(tops.items()):
                      say(f"  - `{k}`: " + ", ".join(f"`{x}`" for x in v[:12]) + (" …" if len(v) > 12 else ""))
                  print("::warning title=Repo thiếu " + str(len(missing)) + " tệp so với gói dự án::" + "; ".join(f"{k}/ ({len(v)})" for k, v in sorted(tops.items())) + ". Tải đủ các thư mục này lên repo (xem Summary của run).")
              if changed:
                  say("- Khác bản đóng gói (có thể bạn đã sửa, hoặc tải lên bản cũ): " + ", ".join(f"`{x}`" for x in changed[:15]) + (" …" if len(changed) > 15 else ""))
          if summary:
              open(summary, "a", encoding="utf-8").write("\n".join(out) + "\n")
          if miss_ess:
              print("::error title=Thiếu tệp build thiết yếu::" + ", ".join(miss_ess))
              sys.exit(1)
          PY

  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Giải nén gói zip dự án nếu có ở gốc repo (chỉ cần up zip lên là đủ)
        run: |
          # R34d: GitHub chỉ đọc file workflow từ chính repo, còn MỌI thứ khác có thể nằm trong zip. Zip ghi đè lên workspace (zip thắng tệp lẻ cũ);
          # chịu được zip có/không có thư mục bọc; nhiều zip thì giải nén theo thứ tự tên (sort -V), zip tên "lớn" nhất thắng.
          shopt -s nullglob
          found=0
          while IFS= read -r -d '' z; do
            [ -n "$z" ] || continue
            listing=$(unzip -l "$z" 2>/dev/null || true)
            if ! grep -qE '(^|[ /])settings\.gradle\.kts$' <<<"$listing"; then
              echo "Bỏ qua $z (không phải gói dự án: không có settings.gradle.kts)"; continue
            fi
            found=$((found+1))
            echo "Giải nén $z vào workspace (ghi đè tệp trùng)"
            tmp=$(mktemp -d)
            unzip -oq "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"
            sg=$(find "$tmp" -maxdepth 3 -name settings.gradle.kts -printf '%d %p\n' | sort -n | head -n1 | cut -d' ' -f2-)
            root=$(dirname "$sg")
            if [ -f "$root/.github/workflows/build-apk.yml" ] && ! cmp -s "$root/.github/workflows/build-apk.yml" .github/workflows/build-apk.yml; then
              echo "::notice title=Workflow trong repo khác bản trong zip::GitHub chỉ đọc workflow từ chính repo, nên bản trong zip chưa có hiệu lực. Hãy thay .github/workflows/build-apk.yml trong repo bằng bản trong zip (hoặc bản build-apk.yml đi kèm) để dùng bản mới nhất."
            fi
            rm -rf "$root/.github"
            cp -a "$root"/. ./
            rm -rf "$tmp"
          done < <(printf '%s\0' ./*.zip | sort -zV)
          if [ "$found" -eq 0 ]; then echo "Không có gói zip dự án ở gốc repo - dùng nguyên nội dung repo."; fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test máy chủ trung gian (credits, định tuyến, hoàn credits khi lỗi)
        if: ${{ hashFiles('backend/test_server.py') != '' }}
        run: python backend/test_server.py
      - name: Bỏ qua test máy chủ (repo không có backend/test_server.py)
        if: ${{ hashFiles('backend/test_server.py') == '' }}
        run: echo "::warning title=Bỏ qua test máy chủ::Repo không có backend/test_server.py - tải thư mục backend/ lên cùng cấp với app/ rồi chạy lại. Xem job repo-check."
      - name: Kiểm tra tĩnh mã Kotlin (ngoặc, import, vm./st., enum) - bắt lỗi tham chiếu sớm, trước khi gradle chạy
        if: ${{ hashFiles('tools/static_check.py') != '' }}
        run: python tools/static_check.py
      - name: Kiểm chứng số học và luật bằng bản port Python (tông màu, LUT, bầu trời, planner, hình học...)
        if: ${{ hashFiles('tools/verify_ports/*.py') != '' }}
        run: |
          pip install numpy scipy opencv-python-headless onnxruntime
          for f in tools/verify_ports/*.py; do echo "=== $f"; python "$f" || exit 1; done

  jvm-check:
    # R19: biên dịch Kotlin THẬT (kotlinc đi kèm Gradle) + chạy mọi test JVM với stub nền tảng, không cần Android SDK. Chạy độc lập với job build
    # để lỗi biên dịch lộ ra sớm và rẻ; KHÔNG thay cho job build (stub không kiểm được chữ ký Compose/ORT/MediaPipe thật). Xem tools/jvm_check/README.md
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Giải nén gói zip dự án nếu có ở gốc repo (chỉ cần up zip lên là đủ)
        run: |
          # R34d: GitHub chỉ đọc file workflow từ chính repo, còn MỌI thứ khác có thể nằm trong zip. Zip ghi đè lên workspace (zip thắng tệp lẻ cũ);
          # chịu được zip có/không có thư mục bọc; nhiều zip thì giải nén theo thứ tự tên (sort -V), zip tên "lớn" nhất thắng.
          shopt -s nullglob
          found=0
          while IFS= read -r -d '' z; do
            [ -n "$z" ] || continue
            listing=$(unzip -l "$z" 2>/dev/null || true)
            if ! grep -qE '(^|[ /])settings\.gradle\.kts$' <<<"$listing"; then
              echo "Bỏ qua $z (không phải gói dự án: không có settings.gradle.kts)"; continue
            fi
            found=$((found+1))
            echo "Giải nén $z vào workspace (ghi đè tệp trùng)"
            tmp=$(mktemp -d)
            unzip -oq "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"
            sg=$(find "$tmp" -maxdepth 3 -name settings.gradle.kts -printf '%d %p\n' | sort -n | head -n1 | cut -d' ' -f2-)
            root=$(dirname "$sg")
            if [ -f "$root/.github/workflows/build-apk.yml" ] && ! cmp -s "$root/.github/workflows/build-apk.yml" .github/workflows/build-apk.yml; then
              echo "::notice title=Workflow trong repo khác bản trong zip::GitHub chỉ đọc workflow từ chính repo, nên bản trong zip chưa có hiệu lực. Hãy thay .github/workflows/build-apk.yml trong repo bằng bản trong zip (hoặc bản build-apk.yml đi kèm) để dùng bản mới nhất."
            fi
            rm -rf "$root/.github"
            cp -a "$root"/. ./
            rm -rf "$tmp"
          done < <(printf '%s\0' ./*.zip | sort -zV)
          if [ "$found" -eq 0 ]; then echo "Không có gói zip dự án ở gốc repo - dùng nguyên nội dung repo."; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"
      - name: Cài numpy/scipy/opencv cho bản port Python
        run: pip install numpy scipy opencv-python-headless onnxruntime
      - name: Biên dịch thật 2 biến thể + JUnit + kiểm tra tĩnh + backend + bản port
        if: ${{ hashFiles('tools/jvm_check/run_all.sh') != '' }}
        run: bash tools/jvm_check/run_all.sh
      - name: Kiểm tích hợp LiteRT-LM với MÃ NGUỒN THẬT của google-ai-edge/LiteRT-LM (không chặn)
        # R40: stub LiteRT-LM tự viết từng đoán sai chữ ký (R34e). Bước này lấy mã Kotlin chính chủ từ GitHub, biên dịch cùng
        # app/src/litertlmReal rồi chạy 12 kiểm tra trên lớp thật. Không chặn: nếu GitHub không tải được hoặc thư viện đổi API thì chỉ báo, nhưng
        # một lần ĐỎ ở đây nghĩa là bản build bật LiteRT-LM (use_litertlm / use_all) rất có thể cũng đỏ ⇒ đừng gửi bản đó cho tester.
        if: ${{ hashFiles('tools/jvm_check/real_litertlm/check_real_litertlm.sh') != '' }}
        continue-on-error: true
        shell: bash
        run: |
          {
            echo "### Kiểm LiteRT-LM với mã nguồn thật"
            echo '```'
            bash tools/jvm_check/real_litertlm/check_real_litertlm.sh "${LITERTLM_TAG:-v0.19.1}" 2>&1 | tail -30
            echo '```'
          } > /tmp/real_litertlm_summary.md || true
          cat /tmp/real_litertlm_summary.md | tee -a "$GITHUB_STEP_SUMMARY"
          if grep -q "TẤT CẢ ĐẠT" /tmp/real_litertlm_summary.md; then echo "LiteRT-LM thật: đạt"; else echo "::warning title=LiteRT-LM thật::bài kiểm với mã nguồn thật không đạt hoặc không chạy được - xem Summary"; exit 1; fi
      - name: Biên dịch app với AAR THẬT của Play Billing / Play Integrity / LiteRT-LM (không chặn)
        # R41: sandbox của Claude không tải được AAR (Maven bị chặn) nên chưa từng biên dịch adapter với thư viện thật. Runner GitHub tải được:
        # bước này lấy classes.jar thật từ Google Maven / Maven Central, biên dịch CẢ DỰ ÁN với chúng thay cho stub (vài phút, không cần Gradle),
        # in phiên bản Kotlin metadata của AAR. Báo sớm lỗi chữ ký thật; lỗi ở đây = bản build bật use_billing / use_integrity / use_litertlm (hoặc use_all) rất có thể đỏ.
        if: ${{ hashFiles('tools/jvm_check/real_aar/check_real_aars.sh') != '' }}
        continue-on-error: true
        shell: bash
        env:
          BILLING_VERSION: ${{ vars.BILLING_VERSION }}
          LITERTLM_VERSION: ${{ github.event.inputs.litertlm_version }}
        run: |
          set +e
          bash tools/jvm_check/real_aar/check_real_aars.sh 2>&1 | tail -60 | tee /tmp/real_aar.txt
          rc=${PIPESTATUS[0]}
          { echo "### Biên dịch với AAR thật (Billing / Integrity / LiteRT-LM)"; echo '```'; cat /tmp/real_aar.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = 0 ]; then echo "AAR thật: đạt"
          elif [ "$rc" = 3 ]; then echo "::warning title=AAR thật::không tải được AAR nào (mạng?) - bỏ qua"
          else echo "::warning title=AAR thật::LỖI biên dịch với thư viện thật - bản build bật cờ tương ứng có thể đỏ, xem Summary"; exit 1; fi
      - name: Kiểm bộ tải model với GitHub THẬT (không chặn)
        # R43: JUnit chỉ thử ModelDownloader / ModelHub với máy chủ cục bộ. Bước này chạy chính các lớp đó với GitHub thật: HTTPS, chuyển hướng sang
        # release-assets.githubusercontent.com, HỦY rồi TIẾP TỤC bằng Range, SHA-256 sai, lùi sang địa chỉ dự phòng khi Release 404. Không chặn.
        if: ${{ hashFiles('tools/jvm_check/real_dl/check_real_download.sh') != '' }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          bash tools/jvm_check/real_dl/check_real_download.sh 2>&1 | tail -30 | tee /tmp/real_dl.txt
          { echo "### Tải model thật từ GitHub"; echo '```'; cat /tmp/real_dl.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -q "TẤT CẢ ĐẠT" /tmp/real_dl.txt; then echo "tải model thật: đạt"; else echo "::warning title=Tải model thật::bộ tải model không đạt khi chạy với GitHub thật - xem Summary"; exit 1; fi
      - name: Bỏ qua jvm-check (repo không có tools/jvm_check)
        if: ${{ hashFiles('tools/jvm_check/run_all.sh') == '' }}
        run: echo "::warning title=Bỏ qua jvm-check::Repo không có tools/jvm_check/run_all.sh - tải thư mục tools/ lên. Xem job repo-check."

  # Biên dịch sd-server (stable-diffusion.cpp, giấy phép MIT) cho Android arm64 để tạo/chỉnh ảnh NGAY TRÊN MÁY.
  # Job này TÙY CHỌN: lỗi thì APK vẫn build bình thường, chỉ thiếu tính năng "tạo ảnh trên máy".
  build-sd-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Biên dịch sd-server
        env:
          SDCPP_REF: ${{ github.event.inputs.sdcpp_ref || 'master' }}
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 --branch "$SDCPP_REF" https://github.com/leejet/stable-diffusion.cpp sdcpp
          COMMIT=$(git -C sdcpp rev-parse HEAD)
          echo "stable-diffusion.cpp commit: $COMMIT" | tee -a "$GITHUB_STEP_SUMMARY"
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          test -d "$NDK"
          # Dùng tập lệnh ARMv8-A nền (chạy được trên mọi chip arm64, kể cả cũ). Bản tối ưu dotprod/i8mm cho máy mạnh: việc sau.
          cmake -S sdcpp -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DSD_BUILD_EXAMPLES=ON \
            -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF \
            -DCMAKE_C_FLAGS="-march=armv8-a" -DCMAKE_CXX_FLAGS="-march=armv8-a" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-z,max-page-size=16384" -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384"
          # ↑ R31: căn chỉnh 16 KB (Google Play bắt buộc với app nhắm Android 15+). NDK r28+ đã mặc định như vậy; r27 trở xuống thì cần cờ này.
          cmake --build build --target sd-server -j4
          BIN=$(find build -name sd-server -type f | head -n1)
          test -n "$BIN"
          mkdir -p out
          cp "$BIN" out/libsd_server.so
          file out/libsd_server.so | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: sd-server-arm64
          path: out/libsd_server.so
          if-no-files-found: error

  build:
    needs: [build-sd-server]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      PLAY_RELEASE: ${{ github.event.inputs.play_release || 'false' }}
      # cùng cờ -P với bước build (dùng cho bước in phiên bản thư viện)
      PFLAGS: -PuseQnn=${{ github.event.inputs.use_qnn || 'false' }} -PuseBilling=${{ (github.event.inputs.use_billing == 'true' || github.event.inputs.use_all == 'true') && 'true' || 'false' }}${{ vars.BILLING_VERSION != '' && format(' -PbillingVersion={0}', vars.BILLING_VERSION) || '' }} -PuseLiteRtLm=${{ (github.event.inputs.use_litertlm == 'true' || github.event.inputs.use_all == 'true') && 'true' || 'false' }}${{ github.event.inputs.litertlm_version != '' && format(' -PlitertlmVersion={0}', github.event.inputs.litertlm_version) || '' }} -PuseIntegrity=${{ (github.event.inputs.use_integrity == 'true' || github.event.inputs.use_all == 'true') && 'true' || 'false' }}${{ github.event.inputs.integrity_cloud_project != '' && format(' -PintegrityCloudProject={0}', github.event.inputs.integrity_cloud_project) || '' }}${{ github.event.inputs.play_release == 'true' && ' -PplayRelease=true' || '' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Giải nén gói zip dự án nếu có ở gốc repo (chỉ cần up zip lên là đủ)
        run: |
          # R34d: GitHub chỉ đọc file workflow từ chính repo, còn MỌI thứ khác có thể nằm trong zip. Zip ghi đè lên workspace (zip thắng tệp lẻ cũ);
          # chịu được zip có/không có thư mục bọc; nhiều zip thì giải nén theo thứ tự tên (sort -V), zip tên "lớn" nhất thắng.
          shopt -s nullglob
          found=0
          while IFS= read -r -d '' z; do
            [ -n "$z" ] || continue
            listing=$(unzip -l "$z" 2>/dev/null || true)
            if ! grep -qE '(^|[ /])settings\.gradle\.kts$' <<<"$listing"; then
              echo "Bỏ qua $z (không phải gói dự án: không có settings.gradle.kts)"; continue
            fi
            found=$((found+1))
            echo "Giải nén $z vào workspace (ghi đè tệp trùng)"
            tmp=$(mktemp -d)
            unzip -oq "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"
            sg=$(find "$tmp" -maxdepth 3 -name settings.gradle.kts -printf '%d %p\n' | sort -n | head -n1 | cut -d' ' -f2-)
            root=$(dirname "$sg")
            if [ -f "$root/.github/workflows/build-apk.yml" ] && ! cmp -s "$root/.github/workflows/build-apk.yml" .github/workflows/build-apk.yml; then
              echo "::notice title=Workflow trong repo khác bản trong zip::GitHub chỉ đọc workflow từ chính repo, nên bản trong zip chưa có hiệu lực. Hãy thay .github/workflows/build-apk.yml trong repo bằng bản trong zip (hoặc bản build-apk.yml đi kèm) để dùng bản mới nhất."
            fi
            rm -rf "$root/.github"
            cp -a "$root"/. ./
            rm -rf "$tmp"
          done < <(printf '%s\0' ./*.zip | sort -zV)
          if [ "$found" -eq 0 ]; then echo "Không có gói zip dự án ở gốc repo - dùng nguyên nội dung repo."; fi

      - name: Gắn kho model vào danh mục model có sẵn trong app (R43; R48 chuyển xuống SAU bước giải nén)
        # R48: bước này TRƯỚC ĐÂY nằm trước bước giải nén zip nên khi repo chỉ có AIPhotoStudio.zip ở gốc thì chưa có
        # app/src/main/assets/model_catalog.json => "sed: can't read ... No such file or directory" (Build APK #35, job build-play).
        # Thay __REPO__ bằng chủ/kho thật để app biết tải danh mục mới nhất từ Release (xem tools/models/mirror_models.py). Biến repo MODELS_REPO ghi đè khi model nằm ở kho khác.
        env:
          MODELS_REPO: ${{ vars.MODELS_REPO || github.repository }}
        run: |
          f=app/src/main/assets/model_catalog.json
          if [ -f "$f" ]; then
            sed -i "s#__REPO__#${MODELS_REPO}#g" "$f"
            echo "Đã gắn kho model: ${MODELS_REPO}"
          else
            echo "::warning title=Không thấy model_catalog.json::Không có $f sau bước giải nén - bỏ qua việc gắn kho model (app vẫn dùng danh mục có sẵn trong gói nếu có)."
          fi

      - name: Lấy sd-server đã biên dịch (nếu có)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: sd-server-arm64
          path: app/src/main/jniLibs/arm64-v8a

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Chấp nhận license Android SDK (phòng khi runner thiếu platform/build-tools)
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Cache toàn bộ ~/.gradle (dependencies, wrapper, build cache) giữa các lần chạy
      - uses: gradle/actions/setup-gradle@v5
        with:
          # R31: bản play_release (API 36) cần AGP 8.9.1 ⇒ Gradle >= 8.11.1; bản tester giữ 8.7 như cũ
          gradle-version: ${{ github.event.inputs.play_release == 'true' && '8.14.3' || '8.7' }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      # Kiểm thử logic (planner VI/EN, GenIntent, Curves, Blend, định tuyến, hồ sơ hiệu năng). Lỗi test không chặn APK.
      - name: Unit tests
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --build-cache --stacktrace
      - name: Tóm tắt kết quả Unit tests (bài nào hỏng, vì sao)
        # R42: bước trên không chặn nên một bài đỏ chỉ để lại chú thích "Process completed with exit code 1" mà không nói bài nào. Bước này đọc XML của Gradle và ghi vào Summary.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 tools/junit_summary.py app/build/test-results/testDebugUnitTest | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Chọn phiên bản LiteRT-LM mà D8 của AGP đọc được (R49)
        # R49: Build APK #39 đỏ vì litertlm-android 0.20.0 chứa bytecode Java 25 (class major 69) - D8 của AGP 8.5.2 không đọc. Script tải maven-metadata.xml từ Google Maven,
        # đọc major của mọi lớp trong AAR từ bản mới đến cũ (khoảng 0.18.0 <= v < 0.21.0 đã kiểm API với mã thật) và chọn bản mới nhất đạt; ghi ORG_GRADLE_PROJECT_litertlmVersion.
        # Bỏ qua khi bạn tự điền ô litertlm_version. Không tải được thì dùng 0.18.1 kèm cảnh báo.
        if: ${{ (github.event.inputs.use_litertlm == 'true' || github.event.inputs.use_all == 'true') && github.event.inputs.litertlm_version == '' }}
        run: python3 tools/pick_litertlm_version.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --build-cache --stacktrace -PuseQnn=${{ github.event.inputs.use_qnn || 'false' }} -PuseBilling=${{ (github.event.inputs.use_billing == 'true' || github.event.inputs.use_all == 'true') && 'true' || 'false' }}${{ vars.BILLING_VERSION != '' && format(' -PbillingVersion={0}', vars.BILLING_VERSION) || '' }} -PuseLiteRtLm=${{ (github.event.inputs.use_litertlm == 'true' || github.event.inputs.use_all == 'true') && 'true' || 'false' }}${{ github.event.inputs.litertlm_version != '' && format(' -PlitertlmVersion={0}', github.event.inputs.litertlm_version) || '' }} -PuseIntegrity=${{ (github.event.inputs.use_integrity == 'true' || github.event.inputs.use_all == 'true') && 'true' || 'false' }}${{ github.event.inputs.integrity_cloud_project != '' && format(' -PintegrityCloudProject={0}', github.event.inputs.integrity_cloud_project) || '' }} -PversionCode=${{ github.run_number }}${{ github.event.inputs.play_release == 'true' && ' -PplayRelease=true' || '' }}

      # R31: Google Play chặn bản cập nhật có thư viện native căn chỉnh 4 KB (hạn 01/02/2027). Không chặn APK tester, chỉ báo vào Summary.
      - name: Kiểm tra căn chỉnh 16 KB của thư viện native trong APK
        continue-on-error: true
        run: python3 tools/check_16kb.py app/build/outputs/apk/debug/*.apk | tee -a "$GITHUB_STEP_SUMMARY"

      # R32: in phiên bản THẬT của các thư viện chính đã được Gradle giải quyết (kể cả `latest.release` của LiteRT-LM) để ghim bằng ô `litertlm_version`
      # mà không phải đoán số phiên bản. Chỉ báo vào Summary, không chặn.
      - name: Ghi phiên bản thư viện đã giải quyết
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          {
            echo "### Phiên bản thư viện đã giải quyết (debugRuntimeClasspath)"
            echo '```'
            gradle :app:dependencies --configuration debugRuntimeClasspath $PFLAGS 2>/dev/null \
              | grep -E 'litertlm|onnxruntime|mediapipe|billing|play:integrity|androidx.compose.ui:ui:|androidx.activity:activity|androidx.lifecycle:lifecycle-(runtime|viewmodel)-compose|androidx.core:core' \
              | sed -E 's/^[| +\\-]*//' | sort -u
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # R47: lần chạy bật use_all đỏ ở checkDebugAarMetadata (14 mục: Compose ui 1.9.0, lifecycle 2.10.0, core 1.15.0 đòi compileSdk 35 / AGP 8.6) mà log không
      # nói THƯ VIỆN NÀO kéo chúng. Bước này CHỈ chạy khi có bước lỗi và ghi vào Summary chuỗi phụ thuộc để biết chính xác (app/build.gradle.kts đã có
      # biện pháp ghim về bản đã kiểm khi bật thư viện tùy chọn — nếu vẫn đỏ, đây là chỗ đọc nguyên nhân).
      - name: Chẩn đoán - thư viện nào kéo androidx bản mới
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          {
            echo "### Ai kéo androidx bản mới (dependencyInsight, debugRuntimeClasspath)"
            for dep in androidx.compose.ui:ui androidx.lifecycle:lifecycle-runtime-compose androidx.core:core; do
              echo "#### $dep"
              echo '```'
              gradle :app:dependencyInsight --configuration debugRuntimeClasspath --dependency "$dep" $PFLAGS 2>&1 | head -60
              echo '```'
            done
            # R49: lỗi Compose "makeComposableAnnotation" (NPE) = androidx.compose.runtime.Composable không có trên classpath BIÊN DỊCH => in classpath biên dịch + ai kéo runtime
            echo "### Classpath BIÊN DỊCH (debugCompileClasspath): các tệp compose / lifecycle / core / litertlm"
            echo '```'
            gradle :app:printCompileClasspath -q $PFLAGS 2>&1 | grep -i -E 'compose|lifecycle|core-|litertlm|annotation' | head -80
            echo '```'
            echo "#### dependencyInsight androidx.compose.runtime:runtime (debugCompileClasspath)"
            echo '```'
            gradle :app:dependencyInsight --configuration debugCompileClasspath --dependency androidx.compose.runtime:runtime $PFLAGS 2>&1 | head -80
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: AIPhotoStudio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # R32: luôn dựng thử bản theo yêu cầu Google Play (API 36 + AGP 8.9.1 + Gradle 8.14.3) ở job RIÊNG, KHÔNG chặn: lỗi ở đây không làm hỏng bản tester,
  # nhưng mỗi lần chạy bạn đều có kết quả (đỏ/xanh + log + bước kiểm 16 KB) mà không phải bật tay `play_release`. Bỏ qua khi chính lần chạy này đã bật `play_release`.
