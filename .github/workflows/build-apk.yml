          if [ -f "$f" ]; then
            sed -i "s#__REPO__#${MODELS_REPO}#g" "$f"
            echo "Đã gắn kho model: ${MODELS_REPO}"
          else
            echo "::warning title=Không thấy model_catalog.json::Không có $f sau bước giải nén - bỏ qua việc gắn kho model (app vẫn dùng danh mục có sẵn trong gói nếu có)."
          fi

      - name: Lấy sd-server đã biên dịch (nếu có)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: sd-server-arm64
          path: app/src/main/jniLibs/arm64-v8a

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.14.3
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Build bản ĐO HIỆU NĂNG (không debuggable) kèm báo cáo Compose compiler
        run: gradle :app:assemblePerf --build-cache --stacktrace -PcomposeCompilerReports=true -Pkotlin.caching.enabled=false -PversionCode=${{ github.run_number }}

      - name: Tóm tắt báo cáo Compose compiler (composable không bỏ qua được, lớp không ổn định)
        continue-on-error: true
        run: python3 tools/compose_report_summary.py app/build/compose_compiler | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: AIPhotoStudio-perf-apk
          path: app/build/outputs/apk/perf/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: compose-compiler-reports
          path: app/build/compose_compiler
          if-no-files-found: warn

      # R8 (tùy chọn): chỉ khi bật perf_r8 khi bấm Run workflow. Lỗi ở đây KHÔNG ảnh hưởng gì khác; luôn tải chẩn đoán để lấy missing_rules.txt
      - name: Build bản perf CÓ R8 (thử nghiệm)
        id: perf_r8
        if: ${{ github.event.inputs.perf_r8 == 'true' }}
        continue-on-error: true
        run: gradle :app:assemblePerf --stacktrace -PperfMinify=true -PversionCode=${{ github.run_number }}

      - name: Đổi tên APK perf-r8
        if: ${{ github.event.inputs.perf_r8 == 'true' && steps.perf_r8.outcome == 'success' }}
        run: cp app/build/outputs/apk/perf/app-perf.apk app/build/outputs/apk/perf/app-perf-r8.apk

      - uses: actions/upload-artifact@v6
        if: ${{ github.event.inputs.perf_r8 == 'true' && steps.perf_r8.outcome == 'success' }}
        with:
          name: AIPhotoStudio-perf-r8-apk
          path: app/build/outputs/apk/perf/app-perf-r8.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: ${{ always() && github.event.inputs.perf_r8 == 'true' }}
        continue-on-error: true
        with:
          name: perf-r8-diagnostics
          path: |
            app/build/outputs/mapping/perf/missing_rules.txt
            app/build/outputs/mapping/perf/configuration.txt
            app/build/outputs/mapping/perf/usage.txt
          if-no-files-found: ignore
